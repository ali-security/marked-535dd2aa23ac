name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Jasmine spec filter (empty runs the full suite)"
        required: false
        default: ""

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 30
    strategy:
      matrix:
        node_version: ['lts/*', 'node']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        if: ${{ inputs.test-filter == '' }}
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        if: ${{ inputs.test-filter == '' }}
        run: npm run test:specs
      - name: Run Filtered Tests
        if: ${{ inputs.test-filter != '' }}
        run: npm test -- --filter="${{ inputs.test-filter }}"

  Release:
    needs: [Test]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Pack
        run: npm pack
      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: marked-*.tgz
          if-no-files-found: error

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
